services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stock_user
      POSTGRES_PASSWORD: stock_password_change_me
      POSTGRES_DB: stock_db
    ports:
      - "5432:5432"
    volumes:
      - stock_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  stock_postgres_data:
